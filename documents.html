<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documents - Finance Suite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .file-list { display: flex; flex-wrap: wrap; gap: 1rem; margin: 2rem 0; }
        .file-item { border: 1px solid var(--border); padding: 1rem; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
        .file-item:hover { background: var(--hover); }
        .file-content { margin-top: 2rem; border: 1px solid var(--border); padding: 1rem; border-radius: 8px; min-height: 400px; }
        .download-btn { margin-top: 1rem; padding: 0.5rem 1rem; background: var(--accent); color: white; border: none; border-radius: 4px; cursor: pointer; }
        .download-btn:hover { background: var(--accent-hover); }
    </style>
</head>
<body>
    <nav class="site-nav">
        <div class="brand"><span class="logo-mark" aria-hidden="true">FS</span><span class="sr-only">Finance Suite</span> Finance Suite</div>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="documents.html" class="active">Documents</a></li>
        </ul>
    </nav>
    <main class="solutions-section" role="main">
        <h1 class="section-title" style="margin-top:0;">Documents</h1>
        <p class="intro-text">View and download Office documents from the data folder.</p>
        <div id="file-list" class="file-list"></div>
    </main>
    <footer class="site-footer" id="site-footer">
        <div>© 2025 Finance Suite.</div>
        <small>All rights reserved.</small>
    </footer>
    <script>
        const API_BASE = 'http://localhost:5050';
        const fileListEl = document.getElementById('file-list');

        async function loadFiles() {
            try {
                const res = await fetch(`${API_BASE}/api/files`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const files = await res.json();
                fileListEl.innerHTML = '';
                if (files.length) {
                    files.forEach(file => {
                        const a = document.createElement('a');
                        a.className = 'file-item';
                        a.href = `${API_BASE}/api/download/${encodeURIComponent(file.path)}`;
                        a.target = '_blank';
                        a.innerHTML = `<strong>${file.name}</strong><br>Type: ${file.type.toUpperCase()} (Click to download)`;
                        fileListEl.appendChild(a);
                    });
                } else {
                    fileListEl.innerHTML = '<p>No Office files found in data folder.</p>';
                }
            } catch (e) {
                fileListEl.innerHTML = `<p>Error loading files: ${e.message}. Make sure the server is running on ${API_BASE}.</p>`;
            }
        }

        loadFiles();
    </script>
</body>
</html>
